<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cash Flow Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
</head>
<body class="bg-slate-50 p-6 font-sans text-slate-800">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-1 space-y-6">
            
            <div class="bg-blue-50 p-5 rounded-lg shadow-sm border border-blue-200">
                <h2 class="font-bold text-lg mb-2 text-blue-800">1. Data Management</h2>
                <p class="text-xs text-blue-600 mb-3">Your data is stored locally in your browser.</p>
                <div class="flex gap-2">
                    <button onclick="importDataPrompt()" class="flex-1 bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700 transition font-semibold shadow-sm">📂 Import JSON</button>
                    <button onclick="exportData()" class="flex-1 bg-white text-blue-600 border border-blue-200 px-3 py-2 rounded hover:bg-blue-50 transition font-semibold">💾 Backup</button>
                </div>
                <button onclick="clearData()" class="w-full mt-2 text-xs text-red-400 hover:text-red-600 hover:underline text-center">Clear Local Data</button>
            </div>

            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                <h2 class="font-bold text-lg mb-4 text-slate-700">2. Starting Position</h2>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Current Bank Balance</label>
                <div class="flex items-center">
                    <span class="bg-slate-100 border border-r-0 border-slate-300 p-2 rounded-l text-slate-500">$</span>
                    <input type="number" id="startBalance" value="0" class="w-full border border-slate-300 p-2 rounded-r focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="saveAndRender()">
                </div>
            </div>

            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                <h2 class="font-bold text-lg mb-4 text-slate-700">3. Add Transaction</h2>
                <div class="space-y-3">
                    <input type="text" id="desc" placeholder="Description" class="w-full border p-2 rounded">
                    <input type="date" id="date" class="w-full border p-2 rounded">
                    <input type="number" id="amount" placeholder="Amount" class="w-full border p-2 rounded">
                    
                    <div class="flex items-center gap-2 py-1">
                        <input type="checkbox" id="recurring" class="w-4 h-4 text-blue-600 rounded">
                        <label for="recurring" class="text-sm text-slate-600">Repeat for 3 months</label>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="addTransaction('income')" class="bg-emerald-100 text-emerald-700 py-2 rounded font-bold hover:bg-emerald-200 border border-emerald-300 transition">+ Income</button>
                        <button onclick="addTransaction('expense')" class="bg-rose-100 text-rose-700 py-2 rounded font-bold hover:bg-rose-200 border border-rose-300 transition">- Expense</button>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 h-[400px] overflow-y-auto">
                <h2 class="font-bold text-lg mb-2 text-slate-700">Ledger</h2>
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0">
                        <tr>
                            <th class="px-2 py-2">Date</th>
                            <th class="px-2 py-2">Desc</th>
                            <th class="px-2 py-2 text-right">Amt</th>
                            <th class="px-2 py-2"></th>
                        </tr>
                    </thead>
                    <tbody id="ledgerBody"></tbody>
                </table>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div id="statusCard" class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="text-sm text-slate-500 uppercase font-bold tracking-wider">Lowest Projected Balance</h3>
                    <p id="minBalanceDisplay" class="text-3xl font-bold text-slate-800">--</p>
                </div>
                <div id="statusIndicator" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-100">Waiting for Data...</div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 relative h-[600px]">
                <canvas id="cfChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const STORE_KEY = 'cashflow_v3_private_data';
        const BAL_KEY = 'cashflow_v3_private_balance';

        // --- STATE ---
        let transactions = [];
        let myChart = null;

        // --- INIT ---
        function init() {
            try {
                // Load from LocalStorage
                const savedData = localStorage.getItem(STORE_KEY);
                const savedBal = localStorage.getItem(BAL_KEY);

                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        if (Array.isArray(parsed)) {
                            transactions = parsed;
                        }
                    } catch(e) { console.error("Data corrupted"); }
                }

                if (savedBal) {
                    document.getElementById('startBalance').value = savedBal;
                }

                // Default Date
                document.getElementById('date').valueAsDate = new Date();
                
                // Render
                renderAll();
            } catch (err) {
                console.error("Initialization Error:", err);
            }
        }

        // --- CORE FUNCTIONS ---

        function saveData() {
            localStorage.setItem(STORE_KEY, JSON.stringify(transactions));
            localStorage.setItem(BAL_KEY, document.getElementById('startBalance').value);
        }

        function clearData() {
            if(confirm("Are you sure? This will wipe all local data.")) {
                localStorage.removeItem(STORE_KEY);
                localStorage.removeItem(BAL_KEY);
                transactions = [];
                document.getElementById('startBalance').value = 0;
                renderAll();
            }
        }

        function exportData() {
            if(transactions.length === 0) {
                alert("No data to export.");
                return;
            }
            const dataStr = JSON.stringify(transactions);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportName = 'cashflow_private_backup.json';
            
            const link = document.createElement('a');
            link.setAttribute('href', dataUri);
            link.setAttribute('download', exportName);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function importDataPrompt() {
            const str = prompt("Paste your JSON data array here:");
            if(!str) return;

            try {
                const parsed = JSON.parse(str);
                if(Array.isArray(parsed)) {
                    if(confirm(`Successfully parsed ${parsed.length} items. Import them?`)) {
                        transactions = parsed;
                        saveAndRender();
                    }
                } else {
                    alert("Invalid format: Data must be a JSON Array [ ... ]");
                }
            } catch(e) {
                alert("Error parsing JSON. Ensure you copied the full code including brackets.");
            }
        }

        function addTransaction(type) {
            const desc = document.getElementById('desc').value;
            const dateStr = document.getElementById('date').value;
            const amountVal = document.getElementById('amount').value;
            const amount = parseFloat(amountVal);
            const isRecurring = document.getElementById('recurring').checked;

            if (!desc || !dateStr || !amountVal) {
                alert("Please fill all fields");
                return;
            }

            const loopCount = isRecurring ? 3 : 1;
            let baseDate = new Date(dateStr);

            for(let i = 0; i < loopCount; i++) {
                let nextDate = new Date(baseDate);
                nextDate.setMonth(baseDate.getMonth() + i);
                
                transactions.push({
                    id: Date.now() + i, 
                    desc: i > 0 ? `${desc} (Month ${i+1})` : desc,
                    date: nextDate.toISOString().split('T')[0],
                    amount,
                    type
                });
            }

            // Cleanup Inputs
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('recurring').checked = false; 
            document.getElementById('desc').focus();
            
            saveAndRender();
        }

        function deleteTrans(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            saveData();
            renderAll();
        }

        function renderAll() {
            renderLedger();
            renderChart();
        }

        // --- RENDERERS ---

        function renderLedger() {
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';
            const sorted = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));

            if (sorted.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400 italic">No transactions yet. Click Import or Add Item.</td></tr>';
                return;
            }

            sorted.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-slate-50 transition";
                const isExp = t.type === 'expense';
                tr.innerHTML = `
                    <td class="px-2 py-3 text-slate-500 whitespace-nowrap">${t.date}</td>
                    <td class="px-2 py-3 font-medium">${t.desc}</td>
                    <td class="px-2 py-3 text-right ${isExp ? 'text-rose-600' : 'text-emerald-600'}">
                        ${isExp ? '-' : '+'}${t.amount}
                    </td>
                    <td class="px-2 py-3 text-right">
                        <button onclick="deleteTrans(${t.id})" class="text-slate-400 hover:text-red-500 font-bold px-2 py-1">&times;</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart() {
            const startBal = parseFloat(document.getElementById('startBalance').value) || 0;
            const sorted = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            const ctx = document.getElementById('cfChart').getContext('2d');

            if (sorted.length === 0) {
                if(myChart) myChart.destroy();
                return;
            }

            // Generate Timeline
            let currentBal = startBal;
            let labels = [];
            let dataPoints = [];
            let pointColors = [];
            let minBal = startBal;
            let lowestDate = "Start";

            // Add starting point
            labels.push("Start");
            dataPoints.push(startBal);
            pointColors.push("#94a3b8");

            sorted.forEach(t => {
                labels.push(`${t.date} | ${t.desc}`); 
                
                if (t.type === 'income') currentBal += t.amount;
                else currentBal -= t.amount;

                if (currentBal < minBal) {
                    minBal = currentBal;
                    lowestDate = t.date;
                }

                dataPoints.push(currentBal);
                pointColors.push(currentBal < 0 ? '#e11d48' : '#10b981');
            });

            // Status Update
            const minDisplay = document.getElementById('minBalanceDisplay');
            const statusInd = document.getElementById('statusIndicator');
            minDisplay.textContent = "$" + minBal.toLocaleString();
            
            if (minBal < 0) {
                minDisplay.className = 'text-3xl font-bold text-rose-600';
                statusInd.innerHTML = `⚠️ Low on ${lowestDate}`;
                statusInd.className = "px-4 py-2 rounded-full font-bold text-sm bg-rose-100 text-rose-700 animate-pulse border border-rose-200";
            } else {
                minDisplay.className = 'text-3xl font-bold text-slate-800';
                statusInd.textContent = "✅ Positive Cash Flow";
                statusInd.className = "px-4 py-2 rounded-full font-bold text-sm bg-emerald-100 text-emerald-700 border border-emerald-200";
            }

            // Chart Render
            if (myChart) myChart.destroy();

            // Safety check for Chart.js
            if (typeof Chart === 'undefined') {
                console.error("Chart.js failed to load");
                return;
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.map(l => l.split(' | ')[0]), // X-axis just date
                    datasets: [{
                        label: 'Projected Balance',
                        data: dataPoints,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        pointBackgroundColor: pointColors,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        stepped: true, 
                    }, {
                        label: 'Zero Line',
                        data: Array(labels.length).fill(0),
                        borderColor: '#ef4444',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            grid: { color: '#f1f5f9' },
                            ticks: { callback: function(value) { return '$' + value; } } 
                        },
                        x: { 
                            ticks: { maxRotation: 45, minRotation: 45 }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: (items) => labels[items[0].dataIndex], 
                                label: (item) => `Balance: $${item.raw.toLocaleString()}`
                            }
                        }
                    }
                }
            });
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
